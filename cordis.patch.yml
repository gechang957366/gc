# ============================================================================
# dsh-weekly-paper — DSH bundle patch
# ============================================================================
# 本文件把"每周论文速递"挂到 Web profile 的配置树上。
#
# 安装（本地开发，link 方式）：
#   dsh plugin --profile web add link:D:\deepseek\dsh-weekly-paper
#
# 只想试装、不改 profile manifest 时，也可以直接把下面两行追加到
#   ~/.dsh/profiles/web/cordis.patch.yml
# （web profile 的 patch 文件是 live 监听的，保存即生效，无需重启）。
# ============================================================================

- insert:
    - id: dsh-weekly-paper
      name: dsh-weekly-paper
